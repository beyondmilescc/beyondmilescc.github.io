<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMCC — Beyond Miles Cycling Club · Bengaluru</title>
  <meta name="description" content="Bengaluru-based cycling collective focused on endurance, discipline, community, and the simple joy of riding.">
  <meta property="og:title" content="Beyond Miles Cycling Club">
  <meta property="og:description" content="Built around the ride. Bengaluru's endurance cycling collective.">
  <meta property="og:image" content="background-road.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e2c87a;
      --gold-dim: rgba(201,168,76,0.18);
      --white: #f7f4ef;
      --white-dim: rgba(247,244,239,0.72);
      --white-faint: rgba(247,244,239,0.38);
    }

    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080705;
    }

    /* ── Background ── */
    .bg {
      position: fixed;
      inset: 0;
      background: url('background-road.jpg') center 40% / cover no-repeat;
      transform: scale(1.06);
      animation: drift 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg,
          rgba(6,5,3,0.52) 0%,
          rgba(6,5,3,0.28) 38%,
          rgba(6,5,3,0.55) 72%,
          rgba(6,5,3,0.82) 100%
        );
    }

    /* subtle vignette */
    .bg-vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(4,3,2,0.68) 100%);
    }

    /* grain texture */
    .bg-grain {
      position: fixed;
      inset: 0;
      opacity: 0.032;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 220px;
      pointer-events: none;
    }

    /* ── Layout ── */
    .stage {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* ── Content ── */
    .content {
      text-align: center;
      max-width: 860px;
      width: 100%;
    }

    .logo-wrap {
      margin-bottom: 2.8rem;
      opacity: 0;
      animation: riseIn 1.4s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
    }

    .logo {
      width: 380px;
      max-width: 78vw;
      filter: drop-shadow(0 0 40px rgba(201,168,76,0.12));
    }

    /* thin gold rule */
    .rule {
      width: 1px;
      height: 64px;
      background: linear-gradient(to bottom, transparent, var(--gold), transparent);
      margin: 0 auto 2.4rem;
      opacity: 0;
      animation: riseIn 1s ease 0.9s forwards;
    }

    .tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 300;
      font-style: italic;
      color: var(--gold-light);
      letter-spacing: 0.04em;
      margin-bottom: 1.6rem;
      opacity: 0;
      animation: riseIn 1s ease 1.1s forwards;
    }

    .description {
      font-family: 'Jost', sans-serif;
      font-size: clamp(0.88rem, 1.8vw, 1.02rem);
      font-weight: 300;
      line-height: 2;
      color: var(--white-dim);
      letter-spacing: 0.04em;
      max-width: 580px;
      margin: 0 auto 2.6rem;
      opacity: 0;
      animation: riseIn 1s ease 1.3s forwards;
    }

    .status-wrap {
      opacity: 0;
      animation: riseIn 1s ease 1.55s forwards;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .launching {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 0.75rem 1.6rem;
      border: 1px solid rgba(201,168,76,0.35);
      background: rgba(201,168,76,0.06);
      backdrop-filter: blur(12px);
      font-family: 'Jost', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
      position: relative;
      overflow: hidden;
    }

    .launching::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.08), transparent);
      transform: translateX(-100%);
      animation: shimmer 3.5s ease 2.5s infinite;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      animation: pulse 2.4s ease infinite;
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.6rem 3rem;
      opacity: 0;
      animation: fadeUp 1s ease 2s forwards;
    }

    .footer-left {
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--white-faint);
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .footer-right a {
      font-family: 'Jost', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white-faint);
      text-decoration: none;
      transition: color 0.35s ease;
      position: relative;
    }

    .footer-right a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--gold);
      transition: width 0.35s ease;
    }

    .footer-right a:hover {
      color: var(--gold);
    }

    .footer-right a:hover::after {
      width: 100%;
    }

    /* ── Keyframes ── */
    @keyframes drift {
      from { transform: scale(1.06) translateY(0); }
      to   { transform: scale(1.10) translateY(-1.5%); }
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      60%  { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.45; transform: scale(0.7); }
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .footer {
        flex-direction: column;
        gap: 0.8rem;
        padding: 1.2rem 1.5rem;
        text-align: center;
      }

      .footer-right {
        gap: 1.4rem;
      }

      .rule {
        height: 44px;
        margin-bottom: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <main class="stage">
    <div class="content">

      <div class="logo-wrap">
        <img src="bmcc-logo.png" alt="BMCC — Beyond Miles Cycling Club" class="logo">
      </div>

      <div class="rule" aria-hidden="true"></div>

      <p class="tagline">Built around the ride.</p>

      <p class="description">
        Bengaluru-based cycling collective focused on endurance,
        discipline, community, and the simple joy of riding.
      </p>

      <div class="status-wrap">
        <div class="launching">
          <span class="pulse-dot" aria-hidden="true"></span>
          Launching Soon
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-left">Bengaluru, India</div>
    <nav class="footer-right" aria-label="Social links">
      <a href="https://www.instagram.com/beyondmilescc/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.strava.com/clubs/2132287" target="_blank" rel="noopener">Strava</a>
      <a href="mailto:hello@beyondmiles.cc">Contact</a>
    </nav>
  </footer>

</body>
</html>
