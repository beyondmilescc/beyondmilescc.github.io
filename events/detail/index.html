<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Details - Beyond Miles Hub</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      background: #F7F7F5; color: #1A1A18; }
    
    /* Nav */
    nav { background: white; border-bottom: 1px solid #f0f0f0; 
      padding: 16px 24px; display: flex; align-items: center; 
      justify-content: space-between; }
    .nav-brand { font-size: 18px; font-weight: 700; color: #1A1A18; 
      text-decoration: none; }
    .nav-back { font-size: 13px; padding: 7px 14px; border-radius: 999px; 
      border: 1px solid #EBEBEA; background: #F7F7F5; color: #1A1A18; 
      text-decoration: none; font-weight: 500; }
    .nav-back:hover { background: #F0EFED; }
    
    /* Content */
    .container { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    
    /* Poster */
    .poster { width: 100%; border-radius: 16px; display: block; 
      margin-bottom: 24px; border: 1px solid #EBEBEA; }
    
    /* Organiser */
    .organiser-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .organiser-logo { width: 44px; height: 44px; border-radius: 8px; 
      object-fit: contain; border: 1px solid #EBEBEA; padding: 4px; background: white; }
    .organiser-label { font-size: 11px; color: #888780; font-weight: 500; }
    .organiser-name { font-size: 14px; font-weight: 700; color: #1A1A18; }
    
    /* Event name */
    .event-name { font-size: 26px; font-weight: 800; line-height: 1.2; 
      margin-bottom: 12px; color: #1A1A18; }
    
    /* Badges */
    .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .badge { font-size: 11px; font-weight: 600; padding: 4px 10px; 
      border-radius: 999px; }
    .badge-type { background: #F0EFED; color: #5F5E5A; }
    .badge-ride { background: #EFF6FF; color: #2563EB; }
    .badge-run { background: #FEF2F2; color: #E8430A; }
    .badge-walk { background: #FFFBEB; color: #B45309; }
    .badge-swim { background: #F5F3FF; color: #7C3AED; }
    
    /* Info card */
    .info-card { background: white; border-radius: 14px; padding: 20px; 
      border: 1px solid #EBEBEA; margin-bottom: 20px; 
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .info-label { font-size: 10px; font-weight: 700; color: #888780; 
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .info-value { font-size: 14px; font-weight: 600; color: #1A1A18; }
    
    /* Buttons */
    .btn-row { display: flex; gap: 10px; margin-bottom: 8px; }
    .btn-register { flex: 1; display: block; text-align: center; padding: 13px; 
      border-radius: 10px; background: #1A1A18; color: white; 
      font-weight: 700; font-size: 14px; text-decoration: none; }
    .btn-register:hover { background: #333; }
    .btn-hub { flex: 1; display: block; text-align: center; padding: 13px; 
      border-radius: 10px; background: #F0FDF4; color: #16A34A; 
      font-weight: 700; font-size: 14px; text-decoration: none; 
      border: 1px solid #BBF7D0; }
    .btn-hub:hover { background: #DCFCE7; }
    
    /* Accordions */
    .accordions { background: white; border-radius: 14px; 
      border: 1px solid #EBEBEA; overflow: hidden; margin-top: 20px; }
    .accordion-item { border-bottom: 1px solid #F0F0F0; }
    .accordion-item:last-child { border-bottom: none; }
    .accordion-btn { width: 100%; display: flex; align-items: center; 
      justify-content: space-between; padding: 16px 20px; background: none; 
      border: none; cursor: pointer; font-size: 14px; font-weight: 600; 
      color: #1A1A18; text-align: left; }
    .accordion-btn:hover { background: #F7F7F5; }
    .accordion-arrow { font-size: 16px; color: #888780; 
      transition: transform 0.2s; display: inline-block; }
    .accordion-arrow.open { transform: rotate(180deg); }
    .accordion-content { display: none; padding: 0 20px 16px; 
      font-size: 13px; color: #5F5E5A; line-height: 1.7; }
    .accordion-content.open { display: block; }
    .accordion-content h2 { font-size: 14px; font-weight: 700; 
      color: #1A1A18; margin: 12px 0 6px; }
    .accordion-content h3 { font-size: 13px; font-weight: 600; 
      color: #1A1A18; margin: 10px 0 4px; }
    .accordion-content ul { 
      list-style-type: disc; 
      padding-left: 20px; 
      margin: 8px 0; 
    }
    .accordion-content ol { 
      list-style-type: decimal; 
      padding-left: 20px; 
      margin: 8px 0; 
    }
    .accordion-content li { margin: 4px 0; }
    .accordion-content p { margin: 6px 0; }
    .accordion-content strong { font-weight: 700; color: #1A1A18; }
    
    /* Loading */
    .loading { text-align: center; padding: 60px 20px; color: #888780; }
    
    @media (max-width: 640px) {
      .info-card { grid-template-columns: 1fr 1fr; }
      .event-name { font-size: 22px; }
      nav { padding: 12px 16px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/events" class="nav-brand">Beyond Miles Hub</a>
  <a href="/events" class="nav-back">← Events</a>
</nav>

<div class="container">
  <div class="loading" id="loading">Loading event...</div>
  <div id="content" style="display:none"></div>
</div>

<script>
  function getSlug() {
    const params = new URLSearchParams(window.location.search)
    return params.get('slug') || 
      window.location.pathname.split('/').filter(Boolean).pop()
  }

  function formatDate(d) {
    if (!d) return ''
    return new Date(d).toLocaleDateString('en-IN', { 
      day: 'numeric', month: 'short', year: 'numeric' 
    })
  }

  function sportBadgeClass(sport) {
    const map = { Ride: 'badge-ride', Run: 'badge-run', 
      Walk: 'badge-walk', Swim: 'badge-swim' }
    return map[sport] || ''
  }

  function toggleAccordion(btn) {
    const arrow = btn.querySelector('.accordion-arrow')
    const content = btn.nextElementSibling
    const isOpen = content.classList.contains('open')
    // Close all
    document.querySelectorAll('.accordion-content').forEach(c => c.classList.remove('open'))
    document.querySelectorAll('.accordion-arrow').forEach(a => a.classList.remove('open'))
    // Open clicked if was closed
    if (!isOpen) {
      content.classList.add('open')
      arrow.classList.add('open')
    }
  }

  async function loadEvent() {
    const slug = getSlug()
    if (!slug) {
      document.getElementById('loading').textContent = 'Event not found.'
      return
    }

    try {
      const res = await fetch(`https://hub.beyondmiles.cc/api/events/${slug}`)
      if (!res.ok) throw new Error('Not found')
      const { listing: e, participant_count } = await res.json()

      document.title = `${e.name} - Beyond Miles Hub`

      const sports = e.sports || []
      const fee = e.fee && e.fee.toUpperCase() !== 'NA' ? e.fee : null
      const dateStr = e.start_date === e.end_date 
        ? formatDate(e.start_date)
        : `${formatDate(e.start_date)} – ${formatDate(e.end_date)}`

      let html = ''

      // Poster
      if (e.poster_url) {
        html += `<img src="${e.poster_url}" class="poster" alt="${e.name}">`
      }

      // Organiser
      html += `<div class="organiser-row">`
      if (e.organiser_logo_url) {
        html += `<img src="${e.organiser_logo_url}" class="organiser-logo" alt="${e.organiser}">`
      }
      html += `<div>
        <div class="organiser-label">Organised by</div>
        <div class="organiser-name">${e.organiser}</div>
      </div></div>`

      // Event name
      html += `<h1 class="event-name">${e.name}</h1>`

      // Badges
      html += `<div class="badges">`
      if (e.event_type) html += `<span class="badge badge-type">${e.event_type}</span>`
      sports.forEach(s => {
        html += `<span class="badge ${sportBadgeClass(s)}">${s}</span>`
      })
      html += `</div>`

      // Info card
      html += `<div class="info-card">
        <div><div class="info-label">Date</div><div class="info-value">${dateStr}</div></div>`
      if (e.city) {
        html += `<div><div class="info-label">Location</div><div class="info-value">${e.city}${e.state ? ', ' + e.state : ''}</div></div>`
      }
      if (fee) {
        html += `<div><div class="info-label">Fee</div><div class="info-value">${fee}</div></div>`
      }
      html += `<div><div class="info-label">Participants</div>
        <div class="info-value">${participant_count > 0 ? participant_count + ' registered' : 'Open'}${e.max_participants ? ' / ' + e.max_participants + ' max' : ''}</div></div>`
      html += `</div>`

      // Buttons
      html += `<div class="btn-row">`
      if (e.registration_url) {
        html += `<a href="${e.registration_url}" target="_blank" class="btn-register">Register →</a>`
      }
      if (e.is_challenge) {
        html += `<a href="https://hub.beyondmiles.cc/challenges/${e.slug}" class="btn-hub">Track on Hub</a>`
      }
      html += `</div>`

      // Accordions
      html += `<div class="accordions">`

      if (e.description) {
        html += `<div class="accordion-item">
          <button class="accordion-btn" onclick="toggleAccordion(this)">
            About this event <span class="accordion-arrow">›</span>
          </button>
          <div class="accordion-content open">${e.description}</div>
        </div>`
      }

      if (e.rules) {
        html += `<div class="accordion-item">
          <button class="accordion-btn" onclick="toggleAccordion(this)">
            Rules & Criteria <span class="accordion-arrow">›</span>
          </button>
          <div class="accordion-content">${e.rules}</div>
        </div>`
      }

      if (e.finisher_awards) {
        html += `<div class="accordion-item">
          <button class="accordion-btn" onclick="toggleAccordion(this)">
            Finisher Awards <span class="accordion-arrow">›</span>
          </button>
          <div class="accordion-content">${e.finisher_awards}</div>
        </div>`
      }

      html += `<div class="accordion-item">
        <button class="accordion-btn" onclick="toggleAccordion(this)">
          Contact & Registration <span class="accordion-arrow">›</span>
        </button>
        <div class="accordion-content">
          <p><strong>Organiser:</strong> ${e.organiser}</p>
          ${e.contact_email ? `<p><strong>Email:</strong> <a href="mailto:${e.contact_email}">${e.contact_email}</a></p>` : ''}
          ${e.registration_url ? `<p><strong>Registration:</strong> <a href="${e.registration_url}" target="_blank">Click here to register</a></p>` : ''}
          <p style="margin-top:12px;color:#888780;font-size:12px;">
            Include your Strava Profile URL in the registration form to enable progress tracking on Beyond Miles Hub.
          </p>
        </div>
      </div>`

      html += `</div>` // end accordions

      document.getElementById('loading').style.display = 'none'
      document.getElementById('content').style.display = 'block'
      document.getElementById('content').innerHTML = html

    } catch(err) {
      document.getElementById('loading').innerHTML = 
        '🏃 Event not found. <a href="/events">← Back to events</a>'
    }
  }

  loadEvent()
</script>
</body>
</html>
