<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Beyond Miles Cycling Club</title>
  <meta name="description" content="Bengaluru-based cycling collective focused on endurance, discipline, community, and the simple joy of riding.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #f5f5f5;
      overflow: hidden;
    }

    .hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.65)
      ),
      url('background-road.jpg') center center / cover no-repeat;
      transform: scale(1.03);
      animation: subtleZoom 18s ease-in-out infinite alternate;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.15;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 820px;
      padding: 2rem;
      animation: fadeIn 1.5s ease;
    }

    .logo {
      width: 420px;
      max-width: 85%;
      margin-bottom: 2.5rem;
      opacity: 0.96;
    }

    .tagline {
      font-size: 1.25rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      margin-bottom: 1.8rem;
      color: #f3f3f3;
      font-style: italic;
    }

    .description {
      font-size: 1.02rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.82);
      max-width: 720px;
      margin: 0 auto 2rem auto;
      font-weight: 300;
    }

    .launching {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 0.5rem;
      padding: 0.85rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(8px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: #d4b06a;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d4b06a;
      flex-shrink: 0;
      animation: pulse 2.4s ease infinite;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      font-size: 0.82rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      text-align: center;
      padding: 0 1rem;
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
    }

    .footer a {
      color: rgba(255,255,255,0.72);
      text-decoration: none;
      transition: 0.3s ease;
      margin: 0 10px;
    }

    .footer a:hover {
      color: #d4b06a;
    }

    @keyframes subtleZoom {
      from { transform: scale(1.03); }
      to   { transform: scale(1.08); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }


    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.65); }
    }

    @media (max-width: 768px) {
      .logo {
        width: 300px;
        margin-bottom: 2rem;
      }
      .tagline {
        font-size: 1.05rem;
        margin-bottom: 1.4rem;
      }
      .description {
        font-size: 0.95rem;
        line-height: 1.8;
      }
      .launching {
        font-size: 0.72rem;
        padding: 0.8rem 1.2rem;
      }
      .footer {
        font-size: 0.7rem;
        width: 90%;
        text-align: center;
        line-height: 1.8;
      }
    }
  </style>
</head>
<body>

  <section class="hero">
    <div class="content">
      <img src="bmcc-logo.png" alt="BMCC Logo" class="logo">

      <div class="tagline">Built around the ride.</div>

      <div class="description">
        Bengaluru-based cycling collective focused on endurance,
        discipline, community, and the simple joy of riding.
      </div>

      <div class="launching">
        <span class="pulse-dot"></span>
        Launching Soon
      </div>
      <a href="https://hub.beyondmiles.cc" 
        style="display:inline-block; margin-top:1.2rem; padding:0.7rem 1.6rem; background:transparent; color:white; border:1px solid rgba(255,255,255,0.4); border-radius:999px; font-size:0.8rem; font-weight:600; letter-spacing:0.04em; text-decoration:none;">
        Open Hub →
      </a>
    </div>

    <div class="footer">
      <a href="https://www.instagram.com/beyondmilescc/" target="_blank" rel="noopener">Instagram</a>
      •
      <a href="https://www.strava.com/clubs/2132287" target="_blank" rel="noopener">Strava</a>
      •
      <a href="mailto:hello@beyondmiles.cc">Contact</a>
    </div>
  </section>

</body>
</html>
